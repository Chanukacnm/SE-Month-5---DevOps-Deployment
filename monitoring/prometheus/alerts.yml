groups:
  - name: adminflow-api
    rules:
      - alert: ApiDown
        expr: up{job="adminflow-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: AdminFlow API is down
          description: Prometheus has not been able to scrape the API for 1 minute.

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{job="adminflow-api",status_code=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total{job="adminflow-api"}[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: More than 5% of API requests are failing with 5xx
          description: "5xx ratio is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="adminflow-api",route=~"/api/.*"}[5m]))
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: API p95 latency above 500 ms
          description: "p95 latency is {{ $value | humanizeDuration }}."

      - alert: LoginFailureSpike
        expr: sum(rate(http_requests_total{route="/api/auth/login",status_code=~"401|429"}[5m])) * 60 > 20
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Unusual number of failed sign-ins (possible brute force)
          description: "{{ $value | printf \"%.0f\" }} failed sign-ins per minute."

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes{job="adminflow-api"} > 400 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API memory above 400 MB
          description: "Resident memory is {{ $value | humanize1024 }}B."

      - alert: EventLoopLag
        expr: nodejs_eventloop_lag_p99_seconds{job="adminflow-api"} > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Node.js event loop is blocked
          description: "p99 event loop lag is {{ $value | humanizeDuration }}."

  - name: adminflow-database
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL is unreachable

      - alert: DbPoolExhausted
        expr: db_pool_connections{state="waiting"} > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Requests are queueing for a database connection
          description: "{{ $value }} queries waiting. Raise DB_POOL_MAX or look for slow queries."
