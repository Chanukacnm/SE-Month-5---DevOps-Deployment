# Routes Prometheus alerts. Critical alerts repeat hourly, warnings every 4 hours.
# To get notified, add a receiver below (Slack, Teams, email, or a webhook) and
# point the matching route at it. Without one, alerts are still listed at
# http://localhost:9093 and on the Grafana dashboard.

route:
  receiver: default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: default
      repeat_interval: 1h

receivers:
  - name: default
    # Example: Slack incoming webhook
    # slack_configs:
    #   - api_url: https://hooks.slack.com/services/XXX/YYY/ZZZ
    #     channel: '#adminflow-alerts'
    #     send_resolved: true
    #     title: '{{ .CommonLabels.severity | toUpper }}: {{ .CommonAnnotations.summary }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'

inhibit_rules:
  # When the API is down, don't also page for its error rate or latency.
  - source_matchers: ['alertname="ApiDown"']
    target_matchers: ['alertname=~"HighErrorRate|HighLatencyP95"']
