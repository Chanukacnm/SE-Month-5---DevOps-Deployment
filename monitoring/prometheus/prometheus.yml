global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: adminflow-api
    metrics_path: /metrics
    static_configs:
      - targets: [backend:3000]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
