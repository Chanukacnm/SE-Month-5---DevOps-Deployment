# Render Blueprint: production infrastructure as code.
# Render > New > Blueprint > pick this repo. It creates the database and both
# services, wires DATABASE_URL, and generates the secrets.
#
# Images come from GHCR, pushed by CI from github.com/Chanukacnm/SE-Month-5---DevOps-Deployment.
# See docs/DEPLOYMENT.md for the full steps.
#
# HTTPS: every *.onrender.com URL (and any custom domain you add) gets a
# managed TLS certificate, and HTTP is redirected to HTTPS.

databases:
  - name: adminflow-db
    databaseName: adminflow
    user: adminflow
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    # No public access: only services in the same Render account and region connect.
    ipAllowList: []

services:
  - type: web
    name: adminflow-api
    runtime: image
    image:
      url: ghcr.io/chanukacnm/se-month-5---devops-deployment/backend:latest
      # Needed only while the GHCR package is private (Render > Settings > Registry credentials).
      # creds:
      #   fromRegistryCreds:
      #     name: ghcr
    plan: free
    region: singapore
    # Readiness check (API + database). Render waits for it to pass before
    # sending traffic to a new deploy, and restarts the instance if it keeps failing.
    healthCheckPath: /health
    # CI decides what ships: it calls the deploy hook with an exact sha-<commit> image.
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: adminflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Protects /metrics, which is reachable from the internet here.
      - key: METRICS_TOKEN
        generateValue: true
      - key: LOG_LEVEL
        value: info
      # Hops in front of the API: Render edge -> nginx (adminflow-web) -> Render edge.
      - key: TRUST_PROXY
        value: "3"

  - type: web
    name: adminflow-web
    runtime: image
    image:
      url: ghcr.io/chanukacnm/se-month-5---devops-deployment/frontend:latest
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      # nginx listens on 8080; tells Render which port to route to.
      - key: PORT
        value: "8080"
      # nginx proxies /api/* here, so the browser stays same-origin (no CORS).
      - key: API_UPSTREAM
        value: https://adminflow-api.onrender.com
